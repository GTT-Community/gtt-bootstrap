<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__SONAR_CSP__">
<title>GTT Sonar</title>
<style>
@font-face{font-family:"Geist";src:local("Geist"),url("__SONAR_FONTS__/Geist-Variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:local("Geist Mono"),url("__SONAR_FONTS__/GeistMono-Variable.woff2") format("woff2");font-weight:100 900}
:root{
  --bg:#0E1621;--surface:#131D2B;--rail:#0B121C;--line:#23324A;--line-soft:#1C2A3D;
  --text:#E6EDF5;--muted:#8FA1B5;--dim:#7D90A6;
  --agent:#2DD4BF;--agent-bg:#0F2A2B;--needs:#FBBF24;--needs-bg:#221D0E;--danger:#F87171;
  --cmd:#0A111A;--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:var(--agent)}
a:hover{color:#99F6E4}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.bar{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:0 24px;min-height:56px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:500 15px var(--mono)}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--agent);display:inline-block}
nav.tabs{display:flex;gap:22px;align-self:stretch;font:13px var(--mono)}
nav.tabs a{display:flex;align-items:center;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--agent)}
.grow{flex:1}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.live{display:flex;align-items:center;gap:7px;color:var(--agent);background:none;border:0;font:12px var(--mono);cursor:pointer;padding:6px 4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--agent);display:inline-block}
.live[aria-pressed="true"]{color:var(--muted)}
.live[aria-pressed="true"] i{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
select,input[type=text]{font:12px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
main{padding:28px 32px 40px;display:flex;flex-direction:column;gap:28px;max-width:1280px;margin:0 auto}
.stale{border:1px solid var(--needs);background:var(--needs-bg);color:var(--needs);border-radius:8px;padding:8px 14px;font:12px var(--mono)}
.cmdline{font:12px var(--mono);color:var(--dim)}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.4px}
h2.sec{margin:0;font:500 13px var(--mono);color:#B6C4D3}
h2.sec::before{content:"# ";color:var(--dim)}
.head{display:flex;flex-direction:column;gap:6px}
.sub{margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.needs{border-color:#5C4A17;overflow:hidden}
.needs .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--needs-bg);border-bottom:1px solid #5C4A17}
.needs h2{margin:0;font:500 13px var(--mono);color:var(--needs)}
.needs h2::before{content:"# ";color:#A88A3A}
.count{font:500 12px var(--mono);padding:1px 8px;border-radius:4px;background:var(--needs);color:var(--bg)}
.needs .hint{font-size:13px;color:#D9C48A}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.ref{font:12px var(--mono);color:var(--muted);min-width:70px}
.grow2{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.grow2 b{font-weight:500}
.small{font-size:13px;color:var(--muted)}
.tag{font:11px var(--mono);padding:2px 7px;border:1px solid #2E4058;border-radius:4px;color:#B6C4D3;display:inline-block}
.tag.dev{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.tag.think{border:1px dashed var(--agent);color:var(--agent)}
.tag.red{border-color:var(--danger);color:var(--danger)}
.tag.amber{border-color:var(--needs);color:var(--needs)}
.cmd{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--cmd);overflow:hidden;max-width:100%}
.cmd code{font:12.5px var(--mono);padding:8px 12px;color:var(--text);overflow-wrap:anywhere}
.cmd code span{color:var(--dim)}
.cmd button{min-height:40px;padding:0 14px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--agent);font:12px var(--mono);cursor:pointer}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font:400 11.5px var(--mono);color:var(--dim);padding:11px 10px;border-bottom:1px solid var(--line)}
td{padding:16px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th:first-child,td:first-child{padding-left:18px}
tr:last-child td{border-bottom:0}
td .stack{display:flex;flex-direction:column;gap:3px}
.bar8{height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 8px)}
.bar8>div{height:100%;background:repeating-linear-gradient(90deg,var(--agent) 0 6px,transparent 6px 8px)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.strip .k{font:11.5px var(--mono);color:var(--dim)}
.strip .v{font:500 18px var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.assert{border:1px dashed var(--agent);background:var(--agent-bg)}
.card .t{font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:9px;border-radius:2px;display:inline-block}
.sw.done{background:var(--agent)}
.sw.prog{background:rgba(45,212,191,.2);box-shadow:inset 0 0 0 1px var(--agent)}
.sw.plan{box-shadow:inset 0 0 0 1px #50647C}
.flow{padding:14px 16px 18px;overflow-x:auto}
.flowin{position:relative;min-width:860px}
.grid2{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center}
.days{display:flex}
.days span{flex:1;text-align:center;font:11px var(--mono);color:var(--muted)}
.days span.we{color:var(--dim)}
.lane{padding:12px 0 4px;font:11.5px var(--mono);color:var(--muted)}
.erow{min-height:58px;border-bottom:1px solid var(--line-soft)}
.erow button.name{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding-right:12px;box-sizing:border-box}
.erow button.name:focus-visible{outline:2px solid var(--agent)}
.track{position:relative;height:30px}
.segs{position:absolute;top:5px;height:20px;display:flex;gap:2px}
.segs div{border-radius:3px}
.segs .d{background:var(--agent)}
.segs .p{background:rgba(45,212,191,.2);box-shadow:inset 0 0 0 1px var(--agent)}
.segs .n{box-shadow:inset 0 0 0 1px #50647C}
.vline{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.vline.today{border-left:2px solid var(--text)}
.vline.eta{border-left:2px dashed var(--agent)}
.vline.due{border-left:2px solid var(--danger)}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.detail>div{background:var(--rail);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.detail h3{margin:0;font:500 12px var(--mono);color:var(--muted)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.scard.over{border-color:var(--danger)}
.sigs{display:flex;flex-direction:column}
.sig{display:flex;gap:12px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.sig:last-child{border-bottom:0}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font:12px var(--mono);color:var(--muted)}
.dayh{font:500 12px var(--mono);color:#B6C4D3;margin:0;padding:10px 18px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.dayh:first-child{border-top:0}
.ev{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid var(--line-soft)}
.ev time{font:12px var(--mono);color:var(--dim);min-width:48px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.agent{background:var(--agent)}
.dot.human{background:var(--text)}
.dot.gtt{background:var(--needs)}
.dot.unknown{box-shadow:inset 0 0 0 1px var(--dim)}
.empty{padding:18px;color:var(--muted)}
.update{border:1px dashed var(--needs);color:var(--needs)}
textarea{font:13px/1.5 var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--cmd);color:var(--text);width:100%;resize:vertical}
@media (max-width:720px){main{padding:20px 16px}.detail{grid-template-columns:1fr}}
</style>
</head>
