<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__SONAR_CSP__">
<title>GTT Sonar</title>
<style>
@font-face{font-family:"Geist";src:local("Geist"),url("__SONAR_FONTS__/Geist-Variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:local("Geist Mono"),url("__SONAR_FONTS__/GeistMono-Variable.woff2") format("woff2");font-weight:100 900}
:root{
  --bg:#0E1621;--surface:#131D2B;--rail:#0B121C;--line:#23324A;--line-soft:#1C2A3D;
  --text:#E6EDF5;--muted:#8FA1B5;--dim:#7D90A6;
  --agent:#2DD4BF;--agent-bg:#0F2A2B;--needs:#FBBF24;--needs-bg:#221D0E;--danger:#F87171;
  --cmd:#0A111A;--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:var(--agent)}
a:hover{color:#99F6E4}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.bar{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:0 24px;min-height:56px;border-bottom:1px solid var(--line)}
.brandbox{display:flex;flex-direction:column;line-height:1.15}.brandbox .home{font:400 10px var(--mono);color:var(--muted,#8b9bb0);text-decoration:none;margin-left:20px}.brandbox .home:hover{text-decoration:underline}
.help{max-width:820px;margin:0 auto;padding:24px 16px}.help h1{margin:0 0 6px}.help .sub{opacity:.75}.help .panel{margin:14px 0;padding:14px 18px}.help li{margin:6px 0;line-height:1.5}
.brand{display:flex;align-items:center;gap:10px;font:500 15px var(--mono)}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--agent);display:inline-block}
nav.tabs{display:flex;gap:22px;align-self:stretch;font:13px var(--mono)}
nav.tabs a{display:flex;align-items:center;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--agent)}
.grow{flex:1}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.live{display:flex;align-items:center;gap:7px;color:var(--agent);background:none;border:0;font:12px var(--mono);cursor:pointer;padding:6px 4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--agent);display:inline-block}
.live[aria-pressed="true"]{color:var(--muted)}
.live[aria-pressed="true"] i{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
select,input[type=text]{font:12px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
main{padding:28px 32px 40px;display:flex;flex-direction:column;gap:28px;max-width:1280px;margin:0 auto}
.stale{border:1px solid var(--needs);background:var(--needs-bg);color:var(--needs);border-radius:8px;padding:8px 14px;font:12px var(--mono)}
.cmdline{font:12px var(--mono);color:var(--dim)}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.4px}
h2.sec{margin:0;font:500 13px var(--mono);color:#B6C4D3}
h2.sec::before{content:"# ";color:var(--dim)}
.head{display:flex;flex-direction:column;gap:6px}
.sub{margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.needs{border-color:#5C4A17;overflow:hidden}
.needs .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--needs-bg);border-bottom:1px solid #5C4A17}
.needs h2{margin:0;font:500 13px var(--mono);color:var(--needs)}
.needs h2::before{content:"# ";color:#A88A3A}
.count{font:500 12px var(--mono);padding:1px 8px;border-radius:4px;background:var(--needs);color:var(--bg)}
.needs .hint{font-size:13px;color:#D9C48A}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.ref{font:12px var(--mono);color:var(--muted);min-width:70px}
.grow2{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.grow2 b{font-weight:500}
.small{font-size:13px;color:var(--muted)}
.tag{font:11px var(--mono);padding:2px 7px;border:1px solid #2E4058;border-radius:4px;color:#B6C4D3;display:inline-block}
.tag.dev{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.tag.think{border:1px dashed var(--agent);color:var(--agent)}
.tag.red{border-color:var(--danger);color:var(--danger)}
.tag.amber{border-color:var(--needs);color:var(--needs)}
.cmd{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--cmd);overflow:hidden;max-width:100%}
.cmd code{font:12.5px var(--mono);padding:8px 12px;color:var(--text);overflow-wrap:anywhere}
.cmd code span{color:var(--dim)}
.cmd button{min-height:40px;padding:0 14px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--agent);font:12px var(--mono);cursor:pointer}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font:400 11.5px var(--mono);color:var(--dim);padding:11px 10px;border-bottom:1px solid var(--line)}
td{padding:16px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th:first-child,td:first-child{padding-left:18px}
tr:last-child td{border-bottom:0}
td .stack{display:flex;flex-direction:column;gap:3px}
.bar8{height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 8px)}
.bar8>div{height:100%;background:repeating-linear-gradient(90deg,var(--agent) 0 6px,transparent 6px 8px)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{background:var(--surface);padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.strip .k{font:11.5px var(--mono);color:var(--dim)}
.strip .v{font:500 18px var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.assert{border:1px dashed var(--agent);background:var(--agent-bg)}
.card .t{font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:9px;border-radius:2px;display:inline-block}
.sw.done{background:var(--agent)}
.sw.prog{background:rgba(45,212,191,.2);box-shadow:inset 0 0 0 1px var(--agent)}
.sw.plan{box-shadow:inset 0 0 0 1px #50647C}
.flow{padding:14px 16px 18px;overflow-x:auto}
.flowin{position:relative;min-width:860px}
.grid2{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center}
.days{display:flex}
.days span{flex:1;text-align:center;font:11px var(--mono);color:var(--muted)}
.days span.we{color:var(--dim)}
.lane{padding:12px 0 4px;font:11.5px var(--mono);color:var(--muted)}
.erow{min-height:58px;border-bottom:1px solid var(--line-soft)}
.erow button.name{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding-right:12px;box-sizing:border-box}
.erow button.name:focus-visible{outline:2px solid var(--agent)}
.track{position:relative;height:30px}
.segs{position:absolute;top:5px;height:20px;display:flex;gap:2px}
.segs div{border-radius:3px}
.segs .d{background:var(--agent)}
.segs .p{background:rgba(45,212,191,.2);box-shadow:inset 0 0 0 1px var(--agent)}
.segs .n{box-shadow:inset 0 0 0 1px #50647C}
.segs .b{background:var(--danger)}
.vline{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.vline.today{border-left:2px solid var(--text)}
.vline.eta{border-left:2px dashed var(--agent)}
.vline.due{border-left:2px solid var(--danger)}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.detail>div{background:var(--rail);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.detail h3{margin:0;font:500 12px var(--mono);color:var(--muted)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}
.scard.over{border-color:var(--danger)}
.sigs{display:flex;flex-direction:column}
.sig{display:flex;gap:12px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.sig:last-child{border-bottom:0}
.sig.hit{background:var(--agent-bg);outline:1px solid var(--agent)}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font:12px var(--mono);color:var(--muted)}
.dayh{font:500 12px var(--mono);color:#B6C4D3;margin:0;padding:10px 18px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.dayh:first-child{border-top:0}
.ev{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid var(--line-soft)}
.ev time{font:12px var(--mono);color:var(--dim);min-width:48px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.agent{background:var(--agent)}
.dot.human{background:var(--text)}
.dot.gtt{background:var(--needs)}
.dot.unknown{box-shadow:inset 0 0 0 1px var(--dim)}
.empty{padding:18px;color:var(--muted)}
.update{border:1px dashed var(--needs);color:var(--needs)}
details.idle summary{cursor:pointer;padding:12px 18px;font:13px var(--mono);color:var(--muted)}
details.idle[open] summary{border-bottom:1px solid var(--line)}
textarea{font:13px/1.5 var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--cmd);color:var(--text);width:100%;resize:vertical}
@media (max-width:720px){main{padding:20px 16px}.detail{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:14px;align-items:start}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.bcol h3{margin:0;font:500 12px var(--mono);color:#B6C4D3;display:flex;gap:8px;align-items:center}
.bcol h3 .n{font:500 11px var(--mono);padding:0 7px;border-radius:4px;background:var(--line);color:var(--text)}
.icard{background:var(--surface);border:1px solid #4A6288;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.icard.agent{border:1px dashed var(--agent);background:var(--agent-bg)}
.icard.mine{box-shadow:0 0 0 2px var(--needs)}
.icard .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.icard .tt{all:unset;cursor:pointer;font-weight:500;display:block}
.icard .tt:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.icard .trail{display:flex;flex-direction:column;gap:2px;font:11.5px var(--mono);color:var(--muted)}
.icard .trail div{overflow-wrap:anywhere}
.icard pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);background:var(--cmd);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;color:var(--text)}
.icard .cmd{margin-top:2px;flex-direction:column;align-items:stretch}.icard .cmd button{border-left:0;border-top:1px solid var(--line);white-space:nowrap}
.dec{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line-soft)}
.dec:last-child{border-bottom:0}
.dec time{font:12px var(--mono);color:var(--dim);min-width:84px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:12px var(--mono);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--agent);color:var(--agent);background:var(--agent-bg)}
.tag.ok{border-color:#2E6F66;color:var(--agent)}
.ebtn{all:unset;display:flex;align-items:center;gap:16px;flex-wrap:wrap;width:100%;box-sizing:border-box;padding:14px 18px;cursor:pointer}
.ebtn:focus-visible{outline:2px solid var(--agent);outline-offset:-2px}
.ebtn .car{font:12px var(--mono);color:var(--dim);min-width:14px}
.srow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:9px 18px 9px 48px;border-top:1px solid var(--line-soft);background:var(--rail)}
.srow .ref{min-width:84px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .k{font:11px var(--mono);color:var(--dim)} .tile .v{font:600 26px var(--mono)} .tile .n{font-size:12px;color:var(--muted)}
.grp2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--rail);border-top:1px solid var(--line);font:12px var(--mono);color:var(--muted)}
.qrow{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(90px,1fr) auto;gap:12px;align-items:center;padding:8px 18px;border-top:1px solid var(--line-soft)}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.dlist{display:flex;flex-direction:column;gap:2px;padding:10px}
.dlist .grp{font:11px var(--mono);color:var(--dim);padding:10px 8px 4px}
.dlist a{display:block;padding:6px 8px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px;overflow-wrap:anywhere}
.dlist a[aria-current="page"]{background:var(--agent-bg);color:var(--agent)}
.md{padding:20px 26px;max-width:900px}
.md h3,.md h4,.md h5,.md h6{margin:22px 0 8px;font-weight:600;letter-spacing:-0.2px}
.md h3{font-size:22px;margin-top:0}.md h4{font-size:17px}.md h5{font-size:15px}.md h6{font-size:14px;color:var(--muted)}
.md p,.md li{color:#D3DEEA}
.md code{font:12.5px var(--mono);background:var(--cmd);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px}
.md pre{background:var(--cmd);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto}
.md pre code{border:0;padding:0;background:none}
.md blockquote{margin:12px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md .tablewrap table{min-width:0;font-size:13px}
.md .tablewrap th,.md .tablewrap td{padding:7px 10px}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ===== 1.25: the Plan, the Inbox, Activity, Health ===== */
.tag.hollow{border:1px dashed var(--needs);color:var(--needs)}
.tag.hollowa{border:1px dashed var(--agent);color:var(--agent)}
.tag.ok{border-color:var(--agent);color:var(--agent)}
.strip{grid-template-columns:repeat(5,1fr)}
.strip>.fig{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .fig .k{font:11.5px var(--mono);color:var(--dim)}
.strip .fig .v{font:500 20px var(--mono)}
.strip .fig .s{font-size:12.5px;color:var(--muted)}
.amberv{color:var(--needs)}.redv{color:var(--danger)}
.headblock{display:flex;flex-direction:column;gap:2px}
.headrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta .edit{color:var(--agent);border:1px solid var(--agent);border-radius:4px;padding:1px 7px}
.meta .edit.ro{color:var(--muted);border-color:var(--line)}
nav.tabs a b{font:500 11px var(--mono);padding:0 6px;border-radius:4px;background:var(--line);color:var(--text);margin-left:6px}
nav.tabs a b.amber{background:var(--needs);color:var(--bg)}
.now{display:grid;grid-template-columns:1.3fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.now>div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.k2{font:11.5px var(--mono);color:var(--dim)}.k2::before{content:"# "}
.pulse{display:flex;align-items:center;gap:10px}
.pulse i{width:8px;height:8px;border-radius:50%;background:var(--agent);box-shadow:0 0 0 3px var(--agent-bg);flex:none}
.pulse i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--needs)}
.files{font:12px var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.files span::before{content:"~ ";color:var(--agent)}
.nrow{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.nrow:last-child{border-bottom:0}.nrow.more{justify-content:center}
.acts{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:12px var(--mono);padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--cmd);color:var(--text);cursor:pointer;white-space:nowrap}
.btn.pri{border-color:var(--needs);color:var(--needs)}.btn.go{border-color:var(--agent);color:var(--agent)}.btn.ghost{background:none;color:var(--muted)}
.cmd{display:inline-flex}.cmd button{min-height:0;padding:5px 10px}.cmd code{padding:5px 10px;font-size:12px}
.shadow{border:1px dashed var(--needs);border-radius:8px;padding:8px 14px;font:12px var(--mono);color:#D9C48A;background:var(--needs-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.secline{display:flex;align-items:baseline;gap:12px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:12px var(--mono);padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;cursor:pointer}
.chip.on,.chip[aria-pressed="true"]{border-color:var(--agent);color:var(--agent);background:none}
.chip b{color:var(--text);font-weight:500;margin-left:6px}
.lane{font:11.5px var(--mono);color:var(--dim);padding:2px 2px 0}
.epic{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.epic.prop{border:1px dashed var(--agent)}
.ehead-wrap{position:relative}
.ehead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:18px 84px minmax(0,1fr) 210px 150px 128px;gap:14px;align-items:center;padding:12px 16px;width:100%;cursor:pointer}
.ehead:focus-visible{outline:2px solid var(--agent);outline-offset:-2px}
.ehead-wrap>.cref{position:absolute;left:112px;top:12px}
.etitle{display:flex;flex-direction:column;gap:6px;min-width:0}.etitle .t{font-weight:500}
.chev{font:12px var(--mono);color:var(--dim)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pbar{height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 8px);position:relative}
.pbar>.d{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--agent) 0 6px,transparent 6px 8px)}
.pbar>.u{position:absolute;top:0;bottom:0;box-shadow:inset 0 0 0 1px var(--needs)}
.pct{font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.hrs{font:12px var(--mono);color:var(--muted);text-align:right}.hrs b{color:var(--text);font-weight:500}
.efind{padding:0 16px 10px 132px;display:flex;flex-direction:column;gap:6px}
.find{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.lvl{font:10.5px var(--mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.lvl.w{border-color:var(--needs);color:var(--needs)}.lvl.n{border-color:#50647C;color:#B6C4D3}
.who{font:11px var(--mono);color:var(--dim)}.who.me{color:var(--needs)}
.stories{display:flex;flex-direction:column}
.sitem{border-top:1px solid var(--line-soft)}
.srow2{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 130px;gap:10px;padding:10px 16px 10px 132px;align-items:start}
.srow2 .rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.srow2.undef{background:linear-gradient(90deg,rgba(251,191,36,.05),transparent 40%)}
.srow2.blocked{background:linear-gradient(90deg,rgba(248,113,113,.06),transparent 40%)}
.st{font:11px var(--mono);color:var(--muted)}.ready{color:var(--agent);font:12px var(--mono)}
.form{margin:4px 16px 10px 132px;padding:12px 14px;border:1px dashed var(--needs);border-radius:8px;background:var(--rail);display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center}
.form.agent{border-color:var(--agent)}
.form label{font:12px var(--mono);color:var(--muted)}
.form input,.form textarea{font:12.5px var(--mono);padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);width:100%}
.form textarea{min-height:34px;resize:vertical}
.form .acts-row,.form .hint{grid-column:2}.form .hint{font-size:12px;color:var(--dim)}
.miss{font:11.5px var(--mono);color:var(--needs)}.missa{font:11.5px var(--mono);color:var(--agent)}
.efind .form{margin:0}
.blockedinfo{padding:4px 16px 10px 132px;display:flex;flex-direction:column;gap:6px}
.aportebox{padding:2px 16px 10px 132px;display:flex;flex-direction:column;gap:6px}
.aporte{display:inline-flex;flex-direction:column;gap:6px;min-width:260px;max-width:520px}
.aporte textarea{min-height:34px}
.cref{all:unset;cursor:pointer;color:var(--dim);font:12px var(--mono);padding:0 4px}.cref:hover{color:var(--agent)}

.codegrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.mod{all:unset;box-sizing:border-box;position:absolute;display:flex;flex-direction:column;gap:3px;justify-content:center;padding:10px 14px;border:1px solid #2E4058;border-radius:8px;background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--muted)}
.mod b{color:var(--text);font-weight:500}.mod:focus-visible{outline:2px solid var(--agent)}
.mod.hot{border-color:var(--agent);background:var(--agent-bg)}.mod.hot .hotl{color:var(--agent)}
.mod.empty,.mod.out{border:1px dashed #50647C}.mod.out{border-color:var(--needs);color:var(--needs)}
.mod.sel{box-shadow:0 0 0 2px var(--text)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--muted)}.legend .okc{color:var(--agent)}.legend .badc{color:var(--danger)}
@media (max-width:980px){.codegrid{grid-template-columns:1fr}}
.foot{font:12px var(--mono);color:var(--dim)}
.meta2{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}.meta2 .mk{font:11.5px var(--mono);color:var(--dim)}
.lane .gs{margin-left:12px;color:var(--muted)}
.tl .row{padding:8px 18px}
.sessionpre{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--mono);color:var(--muted);max-height:360px;overflow:auto}
@media (max-width:980px){.strip{grid-template-columns:repeat(2,1fr)}.ehead{grid-template-columns:18px 70px minmax(0,1fr)}.ehead>*:nth-child(n+4){display:none}.srow2{grid-template-columns:1fr;padding-left:16px}.efind,.blockedinfo,.aportebox{padding-left:16px}.form{margin-left:16px;grid-template-columns:1fr}.form .acts-row,.form .hint{grid-column:1}.now{grid-template-columns:1fr}}
