<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__SONAR_CSP__">
<title>GTT Sonar</title>
<style>
@font-face{font-family:"Geist";src:local("Geist"),url("__SONAR_FONTS__/Geist-Variable.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:local("Geist Mono"),url("__SONAR_FONTS__/GeistMono-Variable.woff2") format("woff2");font-weight:100 900}

/* ===== tokens: dark is the default; light follows gtt-method.org (white, ink, hairlines; blue = the agent, green = done) =====
   Colour has one meaning everywhere: agent = blue, needs = amber (yours), ok = green (done), danger = red (stops). Words always say it too. */
:root{
  --bg:#0A0A0B;--surface:#131315;--raised:#1A1A1D;--rail:#0F0F11;--line:#27272B;--line-soft:#1F1F23;--line-strong:#3A3A40;
  --text:#F4F4F5;--body:#D4D4D8;--muted:#A6A6AF;--dim:#8E8E98;
  --agent:#82AAFF;--agent-bg:#111A2E;--agent-line:#2B4272;
  --ok:#46D390;--ok-bg:#0E2118;--ok-line:#1F5139;
  --needs:#F5B942;--needs-bg:#1E170A;--needs-line:#4D3A12;
  --danger:#FF7B7B;--danger-bg:#241214;--danger-line:#5A272B;
  --primary:#F4F4F5;--on-primary:#0A0A0B;--cta:#2C61E8;--on-cta:#FFFFFF;
  --cmd:#0D0D0F;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 14px 36px rgba(0,0,0,.45);
  --sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --r:12px;--r-s:8px;--side:240px;
}
:root[data-theme="light"]{
  --bg:#FAFAFA;--surface:#FFFFFF;--raised:#F4F4F5;--rail:#F6F6F7;--line:#E2E2E4;--line-soft:#EDEDEF;--line-strong:#C9C9CE;
  --text:#0A0A0A;--body:#2E2E31;--muted:#4F4F55;--dim:#64646B;
  --agent:#0B46C4;--agent-bg:#EEF3FE;--agent-line:#B9CCF4;
  --ok:#0A6E35;--ok-bg:#ECF8F1;--ok-line:#AEDCC0;
  --needs:#875200;--needs-bg:#FDF6E6;--needs-line:#EDD59C;
  --danger:#B3231A;--danger-bg:#FDEFEE;--danger-line:#F0BDB9;
  --primary:#0A0A0A;--on-primary:#FFFFFF;--cta:#0B46C4;--on-cta:#FFFFFF;
  --cmd:#F6F6F7;
  --shadow:0 1px 2px rgba(10,10,10,.05),0 2px 8px rgba(10,10,10,.03);--shadow-lg:0 14px 34px rgba(10,10,10,.10);
}

/* ===== base ===== */
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--agent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
::selection{background:var(--agent-line)}
::placeholder{color:var(--dim)}
button{font-family:var(--sans)}
code,pre{font-family:var(--mono)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
select,input[type=text],textarea{font:13px/1.5 var(--sans);padding:7px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--text)}
select:hover,input[type=text]:hover,textarea:hover{border-color:var(--line-strong)}
textarea{width:100%;resize:vertical;background:var(--cmd);padding:11px 13px}
.grow{flex:1}
.small{font-size:13px;color:var(--muted)}
.empty{padding:22px 20px;color:var(--muted)}
.foot{font-size:12px;color:var(--dim);padding-top:16px;border-top:1px solid var(--line-soft)}

/* ===== shell: a sidebar on wide screens, a sticky bar on narrow ones ===== */
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--rail)}
.brandbox{display:flex;flex-direction:column;line-height:1.2}
.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:750;letter-spacing:-.03em;white-space:nowrap}
.brand::first-letter{text-transform:uppercase}
.brand i{width:30px;height:30px;border-radius:9px;flex:none;background:radial-gradient(circle at 50% 50%,var(--on-primary) 0 2.5px,transparent 3px 5.5px,var(--on-primary) 6px 7px,transparent 7.5px 10px,var(--on-primary) 10.5px 11.2px,transparent 11.8px),var(--primary)}
.brandbox .home{font-size:11.5px;color:var(--dim);text-decoration:none;margin:-4px 0 0 41px}
.brandbox .home:hover{color:var(--text);text-decoration:underline}
header.bar nav.tabs{display:flex;gap:2px;order:3;flex-basis:100%;overflow-x:auto}
header.bar nav.tabs a{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:var(--r-s);color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap}
header.bar nav.tabs a:hover{color:var(--text);background:var(--raised)}
header.bar nav.tabs a[aria-current="page"]{color:var(--text);background:var(--raised);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
header.bar nav.tabs a .tl-t{display:inline-block}
header.bar nav.tabs a .tl-t::first-letter{text-transform:uppercase}
.navico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a b{font-size:11px;font-weight:650;line-height:18px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--line);color:var(--text);font-variant-numeric:tabular-nums}
nav.tabs a b.amber{background:var(--needs);color:var(--bg)}
.meta{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta .edit{font-size:11.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:999px;padding:1px 10px}
.meta .edit.ro{color:var(--muted);background:transparent;border-color:var(--line-strong)}
.live{display:flex;align-items:center;gap:8px;color:var(--text);background:none;border:0;font-size:12px;cursor:pointer;padding:5px 2px;text-align:left}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);display:inline-block;flex:none}
.live[aria-pressed="true"]{color:var(--muted)}
.live[aria-pressed="true"] i{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
.themebtn{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.themebtn:hover{color:var(--text);border-color:var(--line-strong)}
header.bar .grow{min-width:0}
@media (min-width:1100px){
  #app{padding-left:var(--side)}
  header.bar{position:fixed;top:0;bottom:0;left:0;width:var(--side);flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:22px;padding:20px 12px 16px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  header.bar .brandbox{padding:0 8px}
  header.bar nav.tabs{flex-direction:column;order:0;flex-basis:auto;overflow:visible}
  header.bar nav.tabs a{padding:8px 10px}
  header.bar nav.tabs a b:first-of-type{margin-left:auto}
  header.bar .meta{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line)}
  .themebtn{align-self:stretch}
}

/* ===== page ===== */
main{width:100%;max-width:1200px;margin:0 auto;padding:24px 40px 56px;display:flex;flex-direction:column;gap:26px;min-width:0}
main>*{min-width:0}
.stale{border:1px solid var(--needs-line);background:var(--needs-bg);color:var(--needs);border-radius:var(--r-s);padding:10px 16px;font-size:13px}
.headblock{display:flex;flex-direction:column;gap:4px}
.cmdline{font-size:11px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.headrow{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,3.4vw,38px);line-height:1.12;font-weight:780;letter-spacing:-.04em}
h2.sec{margin:0;font-size:17px;line-height:1.35;font-weight:680;letter-spacing:-.018em}
h2.sec::first-letter{text-transform:uppercase}
h2.sec.raw::first-letter{text-transform:none}
.head{display:flex;flex-direction:column;gap:6px}
.sub{margin:0;color:var(--muted)}
.secline{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tl>h2.sec,.help .panel>h2.sec{padding:15px 20px;border-bottom:1px solid var(--line-soft)}
.k2{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* ===== the consultation thread and what waits for the agent: two quiet cards above the page ===== */
.consult,.await{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;width:calc(100% - 80px);max-width:1120px;margin:14px auto 0;padding:9px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.consult{border-color:var(--agent-line)}
.consult+.await{margin-top:8px}
.consult .ct,.await .at{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--agent)}
.await .at{color:var(--needs)}
.consult .ct::before,.await .at::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.consult>.ct,.await>.at{margin-right:6px;cursor:help}
.await>.at+.small{flex:1 1 320px;min-width:0}
.consult .small.warn{color:var(--needs)}
.consult .cmd{margin:0}
.consult-row{margin-top:4px}
.cpanel{flex-basis:100%;display:grid;gap:8px;padding:6px 0}
.cpanel textarea,.cpanel input[type=text]{width:100%}
.cpanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0;border:0}
.cpanel .bad{color:var(--danger)}

/* whether this page saves or only copies */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:calc(100% - 80px);max-width:1120px;margin:8px auto 0;padding:8px 16px;border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);font-size:12.5px;line-height:1.5}
.modebar.on{border-color:var(--ok-line);border-left-color:var(--ok);background:var(--ok-bg)}
.modebar strong{font-weight:650}
.mline{color:var(--body)}
.mline .cmd{vertical-align:middle;margin-left:4px}
.mk2{display:inline-block;margin-right:8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

/* ===== buttons, commands, tags, chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;font-size:12.5px;font-weight:550;line-height:1.35;padding:6px 13px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;text-align:left}
.btn:hover{background:var(--raised);text-decoration:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:650}
.btn.go{background:var(--cta);border-color:var(--cta);color:var(--on-cta);font-weight:600}
.btn.pri:hover{background:var(--primary);box-shadow:var(--shadow-lg)}
.btn.go:hover{background:var(--cta);box-shadow:var(--shadow-lg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line-strong);background:var(--raised)}
.acts{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmd{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--cmd);overflow:hidden}
.cmd code{font:12px/1.5 var(--mono);padding:6px 11px;color:var(--text);overflow-wrap:anywhere;align-self:center}
.cmd code span{color:var(--dim)}
.cmd button{padding:5px 12px;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.cmd button:hover{background:var(--raised);color:var(--agent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:550;line-height:18px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--body);white-space:nowrap}
a.tag{text-decoration:none}
a.tag:hover{border-color:var(--agent);color:var(--agent)}
.tag+.tag{margin-left:2px}
.tags .tag+.tag{margin-left:0}
.tag.dev{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700;font-size:10.5px;letter-spacing:.08em}
.tag.think{border:1px dashed var(--agent);color:var(--agent);background:transparent}
.tag.red{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger)}
.tag.amber{border-color:var(--needs-line);background:var(--needs-bg);color:var(--needs)}
.tag.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.tag.hollow{border:1px dashed var(--needs);color:var(--needs);background:transparent}
.tag.hollowa{border:1px dashed var(--agent);color:var(--agent);background:transparent}
.lvl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:18px;padding:0 7px;border-radius:5px;border:1px solid var(--line);background:var(--raised);color:var(--muted);white-space:nowrap}
.lvl.w{border-color:var(--needs-line);background:var(--needs-bg);color:var(--needs)}
.lvl.n{color:var(--muted)}
.chips,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.on,.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip b{font-size:11px;font-weight:700;color:inherit;opacity:.72;font-variant-numeric:tabular-nums}
.filters input[type=text]{min-width:230px}
.count{font-size:11.5px;font-weight:700;min-width:22px;text-align:center;line-height:20px;padding:0 7px;border-radius:999px;background:var(--needs);color:var(--bg)}
.ref{font:500 12px var(--mono);color:var(--muted);min-width:72px}
a.ref{color:var(--agent)}
.cref{all:unset;cursor:pointer;color:var(--dim);font-size:12px;padding:0 4px;border-radius:4px}
.cref:hover{color:var(--agent);background:var(--agent-bg)}
.cref:focus-visible{outline:2px solid var(--agent)}
.refl{color:var(--agent);text-decoration:none;border-bottom:1px dotted var(--agent)}
.who{font-size:11.5px;font-weight:550;color:var(--dim);white-space:nowrap}
.who.me{color:var(--needs)}

/* ===== generic rows ===== */
.row{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.grow2{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:3px}
.grow2 b{font-weight:600;letter-spacing:-.008em}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th:first-child,td:first-child{padding-left:20px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--raised)}
td .stack{display:flex;flex-direction:column;gap:3px}
.bar8{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar8>div{height:100%;border-radius:999px;background:var(--ok)}

/* ===== the figures ===== */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.strip>.fig,.strip>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 17px 13px;display:flex;flex-direction:column;gap:5px;min-width:0}
.strip .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.strip .fig .v,.strip>div .v{font-size:32px;line-height:1.12;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.strip .fig[data-fig="eta"] .v{font-size:21px;line-height:1.72;letter-spacing:-.025em}
.strip .fig .s{font-size:12.5px;line-height:1.45;color:var(--muted)}
a.fig{color:inherit;text-decoration:none;cursor:pointer}
a.fig:hover,a.fig:focus-visible{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
a.fig .go{font-size:11.5px;font-weight:550;color:var(--dim);margin-top:auto;padding-top:8px}
a.fig:hover .go,a.fig:focus-visible .go{color:var(--agent)}
.amberv{color:var(--needs)}.redv{color:var(--danger)}.mutev{color:var(--muted)}
@media (min-width:1360px){.strip{grid-template-columns:repeat(5,minmax(0,1fr))}.strip .fig[data-fig="eta"] .v{font-size:18px;line-height:2}}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== now and the last events ===== */
.now{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.now>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pulse{display:flex;align-items:center;gap:12px}
.pulse i{width:9px;height:9px;border-radius:50%;background:var(--agent);box-shadow:0 0 0 4px var(--agent-bg),0 0 0 5px var(--agent-line);flex:none;margin:0 3px}
.pulse i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--needs)}
.files{font:12px/1.7 var(--mono);color:var(--muted);display:flex;flex-direction:column;overflow-wrap:anywhere}
.files span::before{content:"~ ";color:var(--agent)}

/* ===== I need you ===== */
.needs{background:var(--surface);border:1px solid var(--needs-line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.needs .top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:15px 20px;background:var(--needs-bg);border-bottom:1px solid var(--needs-line)}
.needs h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.018em;color:var(--needs)}
.needs h2::first-letter{text-transform:uppercase}
.needs .hint{flex-basis:100%;font-size:13px;color:var(--body);max-width:96ch}
.nrow{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.nrow:last-child{border-bottom:0}
.nrow.more{justify-content:center;padding:12px}
.dcard{display:block}
.dcard .dhead{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.dcard .dhead b{font-size:15.5px}
.dcard .dplain{margin:12px 0 4px;font-size:14px;line-height:1.6;color:var(--body);max-width:96ch}
.dcard .dplain .k2,.dcard .dwhy .k2,.todo .k2{margin-right:8px}
.dcard .dterms{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:6px 0 8px;font-size:12.5px;color:var(--muted)}
.dcard .dterms dt{font:500 12px var(--mono);color:var(--text)}
.dcard .dterms dd{margin:0}
.todo{margin:10px 0 2px;font-size:13px;line-height:1.55;padding:9px 13px;border:1px solid var(--needs-line);border-radius:var(--r-s);background:var(--needs-bg);color:var(--body)}
.dcard .dwhy{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.dcard .dopts{display:grid;gap:8px;margin:12px 0 8px}
.dcard .dopt{display:grid;grid-template-columns:minmax(210px,auto) 1fr;gap:6px 16px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--rail)}
.dcard .dopt:hover{border-color:var(--line-strong)}
.dcard .dopt.rec{border-color:var(--ok-line);background:var(--ok-bg)}
.dcard .dopt b{font-weight:620}
.dcard .dopt .does{display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dcard .dopt .tagrec{font-size:10px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.1em;margin-left:9px}
@media (max-width:640px){.dcard .dopt{grid-template-columns:minmax(0,1fr)}}
.dcard .duntil{font-size:12.5px;color:var(--dim);margin-top:4px}
.dcard .dcite{margin:8px 0;padding:6px 14px;border-left:3px solid var(--line-strong);color:var(--muted);font-size:13px;line-height:1.5}
.dcard .dcite .where{display:inline-block;margin-top:2px}
.otro{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.otro input{flex:1 1 240px;min-width:0}
.youdo{display:flex;flex-direction:column;gap:4px}
.youdo .small{color:var(--needs);line-height:1.45}

/* a decision that is the person's: colour says whose it is, the words say what is asked, the context is one click away */
.need{border:1px solid var(--needs-line);border-left:3px solid var(--needs);border-radius:10px;background:var(--needs-bg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:940px}
.need.ag{border-color:var(--agent-line);border-left-color:var(--agent);background:var(--agent-bg)}
.need .ntop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.need .ntitle{font-weight:650;font-size:14.5px;line-height:1.4;letter-spacing:-.01em}
.need .nask{margin:0;font-size:13.5px;line-height:1.6;color:var(--body)}
.need .nacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.need .aporte{max-width:none;width:100%}
.need .aporte textarea{min-height:56px;background:var(--surface)}
.nctx{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:12.5px;line-height:1.55}
.nctx[hidden]{display:none}
.nctx .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:2px}
.nctx .v{color:var(--text);min-width:0;overflow-wrap:anywhere}
.nctx .v ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.nctx .v .where{font:11px var(--mono);color:var(--agent);margin-right:6px}
.nctx .v .sub{color:var(--muted)}
.nctx .v .tag{margin-left:6px}
@media (max-width:640px){.nctx{grid-template-columns:minmax(0,1fr)}}
.shadow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--needs);border-radius:var(--r);padding:11px 16px;font-size:13px;color:var(--needs);background:var(--needs-bg)}
.update{border:1px dashed var(--needs);color:var(--needs)}

/* what a view is, what it is for and how it is used: in words, visible until the person hides it */
.howwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.how{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px 18px;width:100%;padding:18px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--rail);font-size:13.5px;line-height:1.6}
.how .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--dim);text-transform:uppercase;padding-top:3px}
.how .v{color:var(--body);min-width:0;max-width:100ch}
.how ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.how ol li::marker{color:var(--dim);font-weight:700}
.how dl.terms{margin:0;display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 16px;font-size:13px}
.how dl.terms dt{font-weight:620;color:var(--text)}
.how dl.terms dd{margin:0;color:var(--muted)}
.howwrap>.btn{min-height:28px;padding:3px 11px;font-size:12px}
.howwrap.closed{margin:-18px 0 -6px}
.howwrap.closed>.btn{border:0;background:none;padding:0;min-height:0;color:var(--dim);text-decoration:underline dotted;text-underline-offset:4px}
.howwrap.closed>.btn:hover{color:var(--text)}
@media (min-width:1280px){.how dl.terms{grid-template-columns:132px minmax(0,1fr) 132px minmax(0,1fr)}.how .v:last-child{max-width:none}}
@media (max-width:640px){.how{grid-template-columns:minmax(0,1fr)}.how dl.terms{grid-template-columns:minmax(0,1fr)}}

/* ===== the Plan ===== */
.lane{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:6px 2px 0;margin-bottom:-14px}
.lane .gs{margin-left:12px;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;color:var(--muted)}
.epic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.epic.prop{border:1px dashed var(--agent)}
.ehead-wrap{position:relative}
.ehead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:16px 84px minmax(0,1fr) 190px 112px 128px;gap:14px;align-items:start;padding:17px 20px;width:100%;cursor:pointer}
.ehead:hover{background:var(--raised)}
.ehead:focus-visible{outline:2px solid var(--agent);outline-offset:-2px}
.ehead .eref{color:var(--muted);padding-top:3px;white-space:nowrap}
.ehead-wrap>.cref{position:absolute;left:112px;top:20px}
.chev{width:7px;height:7px;border-right:1.8px solid var(--dim);border-bottom:1.8px solid var(--dim);transform:rotate(-45deg);justify-self:center;margin-top:7px}
.chev.open{transform:rotate(45deg)}
.etitle{display:flex;flex-direction:column;gap:7px;min-width:0}
.etitle .t{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.pbar{height:6px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.pbar>.d{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.pbar>.u{position:absolute;top:0;bottom:0;background:var(--needs-line)}
.pct{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px;font-variant-numeric:tabular-nums}
.hrs{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hrs b{color:var(--text);font-weight:650}
.efind{padding:2px 20px 12px 134px;display:flex;flex-direction:column;gap:8px}
.find{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-size:13px}
.meta2{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta2 .mk{font-size:12px;font-weight:600;color:var(--dim)}
.stories{display:flex;flex-direction:column}
.sitem{border-top:1px solid var(--line-soft)}
.srow2{display:grid;grid-template-columns:minmax(0,1fr) 100px 104px 96px;gap:12px;padding:12px 20px 12px 134px;align-items:start}
.srow2:hover{background-color:var(--raised)}
.srow2 .rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:560}
.srow2 .rt .mono{color:var(--muted);font-weight:500}
.srow2.undef{box-shadow:inset 3px 0 0 var(--needs)}
.srow2.blocked{box-shadow:inset 3px 0 0 var(--danger)}
.st{font-size:12px;color:var(--muted)}
.ready{color:var(--ok);font-size:12px;font-weight:600}
.blockedinfo{padding:4px 20px 12px 134px;display:flex;flex-direction:column;gap:6px}
.aportebox{padding:2px 20px 12px 134px;display:flex;flex-direction:column;gap:6px}
.aporte{display:inline-flex;flex-direction:column;gap:8px;min-width:260px;max-width:520px}
.aporte textarea{min-height:36px}
.aporte .btn{align-self:flex-start}
.form{margin:4px 20px 14px 134px;padding:14px 16px;border:1px dashed var(--needs);border-radius:10px;background:var(--rail);display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 14px;align-items:center}
.form.agent{border-color:var(--agent)}
.form label{font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form textarea{font:13px/1.5 var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--text);width:100%}
.form textarea{min-height:36px;resize:vertical}
.form .acts-row,.form .hint{grid-column:2}
.form .hint{font-size:12px;color:var(--dim)}
.miss{font-size:12px;font-weight:600;color:var(--needs)}
.missa{font-size:12px;font-weight:600;color:var(--agent)}
.efind .form{margin:0}
.tl .row{padding:10px 20px}
@media (max-width:1320px){.ehead{grid-template-columns:16px 84px minmax(0,1fr) 150px 112px}.ehead>*:nth-child(6){display:none}}
@media (max-width:980px){
  .ehead{grid-template-columns:16px 76px minmax(0,1fr)}.ehead>*:nth-child(n+4){display:none}
  .srow2{grid-template-columns:1fr;gap:4px;padding-left:20px}.hrs{text-align:left}
  .efind,.blockedinfo,.aportebox{padding-left:20px}
  .form{margin-left:20px;grid-template-columns:1fr}.form .acts-row,.form .hint{grid-column:1}
  .now{grid-template-columns:1fr}
}

/* ===== Health ===== */
.sigs{display:flex;flex-direction:column;overflow:hidden}
.sig{display:flex;gap:8px 12px;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.sig:last-child{border-bottom:0}
.sig:hover{background:var(--raised)}
.sig .stext{flex:1 1 320px;min-width:0}
.swhere{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.sig.hit{background:var(--agent-bg);box-shadow:inset 0 0 0 1px var(--agent)}
.lvlsep{font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;padding:12px 20px 6px;border-bottom:1px solid var(--line-soft);background:var(--rail)}

/* ===== no urgency: folded, calm, and each group says when it leaves ===== */
.quiet{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.quiet .lane{margin:8px 0 -2px}
.plane{display:flex;flex-direction:column;gap:10px}
.plane>.lane{margin:0}
.qgroup{overflow:hidden;box-shadow:none}
.qhead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px 52px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:13px 20px;cursor:pointer}
.qhead:hover{background:var(--raised)}
.qhead:focus-visible{outline:2px solid var(--agent);outline-offset:-2px}
.qn{font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{display:flex;flex-direction:column;gap:3px;min-width:0}
.qtext b{font-weight:620;letter-spacing:-.008em}
.qline{display:grid;grid-template-columns:176px minmax(0,1fr);align-items:baseline;font-size:12.5px;line-height:1.5;color:var(--muted);max-width:130ch}
.qk{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.qgroup>.sigs{border-top:1px solid var(--line)}
.quietbtn{align-self:flex-start;background:none;border:0;padding:3px 0;font-size:12.5px;font-weight:550;color:var(--dim);cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
.quietbtn:hover{color:var(--text)}
.need.calm{border-color:var(--line);border-left-color:var(--line-strong);background:var(--rail)}
.obsacts{flex-basis:100%;font-size:12.5px}
.obsacts summary{cursor:pointer;color:var(--agent);font-weight:550}
.obsact{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding-top:8px}
@media (max-width:640px){.qhead{grid-template-columns:14px 40px minmax(0,1fr);gap:8px;padding:12px 14px}.qline{grid-template-columns:minmax(0,1fr)}}

/* ===== Activity ===== */
.dayh{margin:0;padding:11px 20px;font-size:12px;font-weight:700;color:var(--body);background:var(--rail);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.dayh:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.ev{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;padding:11px 20px;border-bottom:1px solid var(--line-soft)}
.ev:hover{background:var(--raised)}
.ev time{font:12px var(--mono);color:var(--dim);min-width:48px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.agent{background:var(--agent)}
.dot.human{background:var(--text)}
.dot.gtt{background:var(--needs)}
.dot.unknown{box-shadow:inset 0 0 0 1px var(--dim)}
.sessionpre{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 var(--mono);color:var(--muted);max-height:360px;overflow:auto}
details.idle summary{cursor:pointer;padding:13px 20px;font-size:13px;font-weight:550;color:var(--muted)}
details.idle summary:hover{color:var(--text)}
details.idle[open] summary{border-bottom:1px solid var(--line)}

/* ===== the Inbox: one lane per stage; solid card = a person wrote it, dashed = the agent ===== */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-items:start}
.panel.board{background:transparent;border:0;box-shadow:none;padding:0}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:0;padding:12px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--rail);align-self:stretch}
.bcol h3{margin:0;font-size:13px;font-weight:700;letter-spacing:-.005em;display:flex;gap:8px;align-items:center}
.bcol h3 .n{font-size:11px;font-weight:700;line-height:18px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--line);color:var(--text)}
.colhelp{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.colhelp.me{color:var(--needs)}
.icard{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.icard:hover{box-shadow:var(--shadow-lg)}
.icard.agent{border:1px dashed var(--agent);background:var(--agent-bg)}
.icard.mine{box-shadow:0 0 0 2px var(--needs)}
.icard .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.icard .tt{all:unset;cursor:pointer;font-weight:650;font-size:14.5px;line-height:1.4;letter-spacing:-.012em;display:block}
.icard .tt:hover{color:var(--agent)}
.icard .tt:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.icard .iplain{margin:2px 0;font-size:13px;line-height:1.5;color:var(--body)}
.icard .iplain .k2{display:block;margin-bottom:2px}
.icard .small{font-size:12px}
.icard .trail{display:flex;flex-direction:column;gap:2px;font:11px/1.6 var(--mono);color:var(--muted)}
.icard .trail div{overflow-wrap:anywhere}
.icard pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 var(--mono);background:var(--cmd);border:1px solid var(--line-soft);border-radius:var(--r-s);padding:9px 11px;color:var(--text)}
.icard .cmd{margin-top:2px;flex-direction:column;align-items:stretch}
.icard .cmd code{align-self:stretch}
.icard .cmd button{border-left:0;border-top:1px solid var(--line);white-space:nowrap;min-height:30px}
.dec{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line-soft)}
.dec:last-child{border-bottom:0}
.dec time{font:12px var(--mono);color:var(--dim);min-width:86px}

/* ===== Design: context pages, decisions and documents ===== */
main nav.tabs{display:inline-flex;align-self:flex-start;gap:3px;max-width:100%;flex-wrap:wrap;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--rail)}
main nav.tabs a{padding:6px 15px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:550}
main nav.tabs a:hover{color:var(--text)}
main nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.ctxstrip{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.ctxhead{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.ctxhead strong{font-size:15px;letter-spacing:-.012em}
.ctxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:980px){.ctxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ctxgrid{grid-template-columns:minmax(0,1fr)}}
.ctxcard{display:flex;flex-direction:column;gap:4px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--rail);color:var(--muted);text-decoration:none;position:relative}
a.ctxcard:hover{border-color:var(--line-strong);background:var(--raised);text-decoration:none}
.ctxcard[aria-current="page"],a.ctxcard[aria-current="page"]:hover{border-color:var(--agent);background:var(--agent-bg);box-shadow:inset 0 0 0 1px var(--agent)}
.ctxcard.missing{border-style:dashed;opacity:.75}
.ctxcard .ctxn{position:absolute;top:11px;right:13px;font-size:11px;font-weight:700;color:var(--dim)}
.ctxcard .ctxf{font:11.5px var(--mono);color:var(--agent)}
.ctxcard.missing .ctxf{color:var(--needs)}
.ctxcard .ctxt{font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--text);overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.dlist{display:flex;flex-direction:column;gap:2px;padding:10px}
.dlist .grp{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);padding:12px 9px 5px}
.dlist a{display:block;padding:7px 9px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;overflow-wrap:anywhere}
.dlist a:hover{background:var(--raised);color:var(--text)}
.dlist a[aria-current="page"]{background:var(--agent-bg);color:var(--agent);font-weight:600}
.outline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.outline .chip.sub{opacity:.8}
.docbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0 0 12px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
.md{padding:22px 32px 30px;min-width:0}
.md h3,.md h4,.md h5,.md h6{margin:26px 0 9px;font-weight:700;letter-spacing:-.022em;line-height:1.28}
.md h3{font-size:26px;margin-top:0}.md h4{font-size:18px}.md h5{font-size:15px}.md h6{font-size:14px;color:var(--muted)}
.md p,.md li{color:var(--body);line-height:1.7}
.md p,.md ul,.md ol,.md blockquote{max-width:76ch}
.md code{font:12.5px var(--mono);background:var(--cmd);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md pre{background:var(--cmd);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;overflow-x:auto}
.md pre code{border:0;padding:0;background:none}
.md blockquote{margin:14px 0;padding:4px 16px;border-left:3px solid var(--text);color:var(--muted)}
.md ul,.md ol{margin:9px 0;padding-left:22px}
.md .tablewrap table{min-width:0;font-size:13px}
.md .tablewrap th,.md .tablewrap td{padding:8px 11px}
.md hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.srow{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line-soft)}
.srow:first-child{border-top:0}
.srow .ref{min-width:84px}

/* ===== Code ===== */
.codegrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
@media (max-width:1320px){.codegrid{grid-template-columns:1fr}}
.mod{all:unset;box-sizing:border-box;position:absolute;display:flex;flex-direction:column;gap:3px;justify-content:center;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-size:12.5px;color:var(--muted)}
.mod b{color:var(--text);font-weight:600}
.mod:hover{box-shadow:var(--shadow-lg)}
.mod:focus-visible{outline:2px solid var(--agent)}
.mod.hot{border-color:var(--agent);background:var(--agent-bg)}
.mod.hot .hotl{color:var(--agent)}
.mod.empty,.mod.out{padding:10px 14px;border:1px dashed var(--line-strong)}
.mod.out{border-color:var(--needs);color:var(--needs)}
.mod.sel{box-shadow:0 0 0 2px var(--text)}
.edge{stroke:var(--line-strong);fill:none}.edge.hit{stroke:var(--agent)}.edge.bad{stroke:var(--danger)}
.ahead{fill:var(--line-strong)}.ahead.hit{fill:var(--agent)}.ahead.bad{fill:var(--danger)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .okc{color:var(--agent)}
.legend .badc{color:var(--danger)}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sumline b{color:var(--text);font-weight:650}

/* ===== flow, cards and tiles of the portfolio ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card.assert{border:1px dashed var(--agent);background:var(--agent-bg)}
.card .t{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 17px;display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.tile .v{font-size:30px;font-weight:750;letter-spacing:-.04em}
.tile .n{font-size:12px;color:var(--muted)}
.sw{width:14px;height:9px;border-radius:3px;display:inline-block}
.sw.done{background:var(--ok)}
.sw.prog{background:var(--agent-bg);box-shadow:inset 0 0 0 1px var(--agent)}
.sw.plan{box-shadow:inset 0 0 0 1px var(--line-strong)}
.flow{padding:14px 16px 18px;overflow-x:auto}
.flowin{position:relative;min-width:860px}
.grid2{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center}
.days{display:flex}
.days span{flex:1;text-align:center;font:11px var(--mono);color:var(--muted)}
.days span.we{color:var(--dim)}
.erow{min-height:58px;border-bottom:1px solid var(--line-soft)}
.erow button.name{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding-right:12px;box-sizing:border-box}
.erow button.name:focus-visible{outline:2px solid var(--agent)}
.track{position:relative;height:30px}
.segs{position:absolute;top:5px;height:20px;display:flex;gap:2px}
.segs div{border-radius:4px}
.segs .d{background:var(--ok)}
.segs .p{background:var(--agent-bg);box-shadow:inset 0 0 0 1px var(--agent)}
.segs .n{box-shadow:inset 0 0 0 1px var(--line-strong)}
.segs .b{background:var(--danger)}
.vline{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.vline.today{border-left:2px solid var(--text)}
.vline.eta{border-left:2px dashed var(--agent)}
.vline.due{border-left:2px solid var(--danger)}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.detail>div{background:var(--rail);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.detail h3{margin:0;font-size:13px;font-weight:700}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;overflow-wrap:anywhere}
.scard.over{border-color:var(--danger)}
.grp2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--rail);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.qrow{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(90px,1fr) auto;gap:12px;align-items:center;padding:9px 20px;border-top:1px solid var(--line-soft)}
.ebtn{all:unset;display:flex;align-items:center;gap:16px;flex-wrap:wrap;width:100%;box-sizing:border-box;padding:14px 20px;cursor:pointer}
.ebtn:focus-visible{outline:2px solid var(--agent);outline-offset:-2px}
.ebtn .car{font-size:12px;color:var(--dim);min-width:14px}

/* ===== the guide ===== */
main.help{max-width:900px;gap:14px}
.help h1{margin:0}
.help .sub{margin:-6px 0 10px}
.help .panel ul{margin:0;padding:14px 22px 16px 40px}
.help li{margin:7px 0;line-height:1.65;color:var(--body)}
.help .panel>dl.terms{padding:16px 22px 18px!important}
@media (max-width:640px){.help .panel>dl.terms{grid-template-columns:minmax(0,1fr)!important}}

/* ===== narrow screens ===== */
@media (max-width:720px){
  main{padding:20px 16px 40px;gap:22px}
  .consult,.await,.modebar{width:calc(100% - 32px);margin-top:14px}
  header.bar .meta{font-size:11.5px}
  .themebtn span{display:none}
  .md{padding:18px 18px 24px}
}

</style>

  var main = h("main", { class: "help" }, h("h1", { text: L("Guía de Sonar", "Sonar guide") }), h("p", { class: "sub", text: L("Qué es cada vista, cómo leerla y qué puedes hacer aquí.", "What each view is, how to read it and what you can do here.") }));
  function panel(title, items) { return h("section", { class: "panel" }, h("h2", { class: "sec", text: title }), h("ul", null, items.map(function (t) { return h("li", { text: t }); }))); }
  main.appendChild(panel(L("Las vistas", "The views"), [
    L("Plan: las épicas en el orden en que se construyen, con sus historias, lo que le falta a cada una y a quién le toca. Aquí lo llenas.", "Plan: the Epics in the order they are built, with their Stories, what each still lacks and whom it is up to. You fill it in here."),
    L("Bandeja: ideas sin triage, propuestas sin confirmar y borradores de ADR a medias.", "Inbox: ideas not triaged, proposals not confirmed and ADR drafts half written."),
    L("Actividad: qué hace claude ahora, con o sin hooks; lo que pasó, día por día; y lo que vio en su última sesión.", "Activity: what claude is doing now, with or without hooks; what happened, day by day; and what it saw in its last session."),
    L("Salud: primero las alertas, por plano; después «sin urgencia», agrupado y cerrado, donde cada grupo dice si se va solo, cuándo se va y por qué puede esperar; y abajo el estado de cada chequeo. Cada elemento enlaza a su contenido.", "Health: the alerts first, by plane; then “no urgency”, grouped and folded, where each group says whether it leaves by itself, when it leaves and why it can wait; and below, the state of each check. Each item links to its content."),
    L("Diseño: el contexto gobernado, los ADR adoptados y el diseño de cada épica.", "Design: the governed context, the adopted ADRs and the design of each Epic."),
    L("Código: los módulos de stack.md contra las importaciones reales, qué se construyó, quién lo construyó y si respeta la arquitectura.", "Code: the modules of stack.md against the real imports, what was built, who built it and whether it respects the architecture.")]));
  main.appendChild(panel(L("Cómo se lee", "How to read it"), [
    L("Borde punteado ámbar: por definir y te toca. Punteado azul: por definir y le toca a claude, o una propuesta que espera aprobación. Sólido: ratificado o tuyo y completo.", "Dashed amber: to define and yours. Dashed blue: to define and the agent's, or a proposal waiting for approval. Solid: ratified, or yours and complete."),
    L("Los tres números que piden algo significan una sola cosa en todas las vistas. «Te necesito»: lo que hoy espera un acto tuyo. «Alertas»: lo que conviene atender pronto. «Sin urgencia»: lo demás; no cuenta en ninguna cifra y cada grupo dice cuándo se va.", "The numbers that ask for something mean one thing in every view. “I need you”: what waits for an act of yours today. “Alerts”: what to attend soon. “No urgency”: the rest; it is in no figure and each group says when it leaves."),
    L("«te toca», «le toca a claude», «siguiente», «sin atribuir» e «inferido» siempre se dicen con palabras, nunca solo con color.", "“yours”, “the agent's”, “next”, “unattributed” and “inferred” are always said in words, never by colour alone."),
    L("Sin calibrar: mientras haya menos de 3 historias medidas, la fecha es un rango (1 a 2 veces la estimación), no una fecha falsa.", "Uncalibrated: with fewer than 3 Stories measured, the date is a range (1 to 2 times the estimate), not a false date.")]));
  main.appendChild(panel(L("Qué puedes hacer", "What you can do"), [
    L("Con «gtt sonar» (editable): responder una pregunta, llenar los campos de una historia o de una épica propuesta, y dejar un aporte sobre una épica, un diseño o un vacío.", "With `gtt sonar` (editable): answer a question, fill the fields of a Story or of a proposed Epic, and leave input on an Epic, a design or a gap."),
    L("Aprobar, promover, correr, deshacer y congelar siguen en tu terminal: Sonar te deja el comando para copiar.", "Approve, promote, run, undo and freeze stay in your terminal: Sonar leaves you the command to copy."),
    L("Con «gtt sonar --static» (solo lectura): en vez de formularios hay comandos y texto para copiar al chat.", "With `gtt sonar --static` (read only): instead of forms there are commands and text to copy into the chat.")]));
  var T1 = TERMS();
  main.appendChild(h("section", { class: "panel" }, h("h2", { class: "sec", text: L("Las palabras que verás", "The words you will meet") }),
    h("dl", { class: "terms", style: "display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 16px;margin:0;padding:0 4px" }, Object.keys(T1).map(function (k) { return [h("dt", { style: "font-weight:600", text: T1[k][0] }), h("dd", { style: "margin:0;color:var(--muted)", text: T1[k][1] })]; }).reduce(function (a, b) { return a.concat(b); }, []))));
  main.appendChild(panel(L("Dónde puedes pedirle ayuda a Claude", "Where you can ask Claude for help"), [
    L("La barra de arriba es el hilo de Claude web del proyecto: una sola conversación que conoce tu contexto. Los botones «Consultar en Claude» le llevan una pregunta con su contexto; tú traes la respuesta de vuelta.", "The bar at the top is the project's Claude web thread: one conversation that knows your context. The “Consult in Claude” buttons take it a question with its context; you bring the answer back."),
    L("Hay botón en: las preguntas de «te necesito», las propuestas de la Bandeja, los vacíos abiertos (Plan y Salud) y las épicas propuestas. En Diseño, «Pedirle a Claude que lo explique» sirve para cualquier documento.", "There is a button on: the “I need you” questions, the Inbox proposals, open gaps (Plan and Health) and proposed Epics. In Design, “Ask Claude to explain it” works for any document."),
    L("Claude puede recomendar, pero la decisión y los actos que cambian el diseño (aprobar, ratificar, congelar) son solo tuyos.", "Claude can recommend, but the decision and the acts that change the design (approve, ratify, freeze) are yours alone.")]));
  main.appendChild(h("p", { class: "small" }, L("Más en ", "More at "), h("a", { href: "https://gtt-method.org/sonar/", target: "_blank", rel: "noopener noreferrer", text: "gtt-method.org/sonar/" })));
  return main;

/* ---------- does this page change anything? said in words, on every view: the question must never be left to guessing ---------- */
function modeBar(snap) {
  if (!snap) return null;
  var on = !!editable(snap);
  var bar = h("div", { class: "modebar " + (on ? "on" : "off"), role: "note", "aria-label": L("qué guarda esta página", "what this page saves") });
  bar.appendChild(h("strong", { text: on ? L("Editable: lo que envías aquí se guarda en GTT.", "Editable: what you send here is saved in GTT.")
    : L("Solo lectura: esta página no cambia nada en GTT.", "Read only: this page changes nothing in GTT.") }));
  if (on) {
    bar.appendChild(h("span", { class: "mline", title: L("Se guarda: respuestas y decisiones, datos de historias y épicas propuestas, ideas y aportes, y la URL del hilo. El agente aplica tus respuestas en tu próximo mensaje.", "Saved: answers and decisions, the fields of Stories and proposed Epics, ideas and inputs, and the thread's URL. The agent applies your answers at your next message."),
      text: L("Aprobar, promover, ejecutar, congelar, deshacer y decidir observaciones: solo en tu terminal.", "Approving, promoting, running, freezing, undoing and deciding observations: only in your terminal.") }));
  } else if (SERVED) {
    bar.appendChild(h("span", { class: "mline", text: L("Este proyecto necesita actualizar GTT para poder editar desde aquí.", "This project needs a GTT update before it can be edited from here.") }));
  } else {
    bar.appendChild(h("span", { class: "mline" }, L("Para responder desde la página: ", "To answer from the page: "), cmdLine("cd '" + String(snap.repo.path).replace(/'/g, "'\\''") + "' && gtt sonar")));
  }
  return bar;
}

/* ---------- render + refresh ---------- */
var timer = null;
function render() {
  applyTheme();
  var st = readHash(); var snap = currentSnap();
  var view = st.view || (OK.length > 1 && !st.repo ? "portfolio" : "plan");
  if (["plan", "inbox", "activity", "health", "design", "code", "portfolio", "help"].indexOf(view) < 0) view = "plan";
  if (view === "portfolio" && OK.length < 2) view = "plan";
  var app = document.getElementById("app");
  var focus = document.activeElement && document.activeElement.id;
  var sel = null;
  if (document.activeElement && (document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "INPUT")) { try { sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch (e) { sel = null; } }
  while (app.firstChild) app.removeChild(app.firstChild);
  app.appendChild(topBar2(view, snap));
  var cbar = snap ? consultBar(snap) : null; if (cbar) app.appendChild(cbar);
  var wbar = snap ? awaitingBar(snap) : null; if (wbar) app.appendChild(wbar);
  var mbar = view === "plan" || view === "inbox" ? modeBar(snap) : null; if (mbar) app.appendChild(mbar);
  var banner = staleBanner();
  var page = view === "plan" ? viewPlan() : view === "inbox" ? viewInbox() : view === "activity" ? viewActivity() : view === "health" ? viewHealth() : view === "design" ? viewDesign() : view === "code" ? viewCode() : view === "portfolio" ? viewPortfolio2() : viewHelp2();
  if (banner && !SERVED) page.insertBefore(banner, page.firstChild);
  app.appendChild(page);
  if (focus) { var el = document.getElementById(focus); if (el) { el.focus(); if (sel && el.setSelectionRange && (el.tagName === "TEXTAREA" || el.type === "text")) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
  try {
    var saved = sessionStorage.getItem("sonar-scroll");
    if (saved) { sessionStorage.removeItem("sonar-scroll"); var cut = saved.indexOf("|"); if (saved.slice(0, cut) === location.hash) window.scrollTo(0, parseInt(saved.slice(cut + 1), 10) || 0); }
  } catch (e) {}
  var landing = readHash().at;
  if (landing) {                       /* a link to a section: land on it, then forget it so a later click does not scroll again */
    setTimeout(function () {
      var target = document.getElementById(landing);
      if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
      try { var x = readHash(); delete x.at; history.replaceState(null, "", "#/" + Object.keys(x).filter(function (k) { return x[k] !== ""; }).map(function (k) { return k + "=" + encodeURIComponent(x[k]); }).join("&")); } catch (e) {}
    }, 0);
  }
  document.title = "GTT Sonar · " + view;
}
function schedule() {
  if (timer) { clearTimeout(timer); timer = null; }
  if (SERVED || readHash().pause === "1") return;       /* the served page repaints from the server; the static one reloads */
  timer = setTimeout(function () {
    var a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) { schedule(); return; }      /* never reload under a draft being typed */
    try { sessionStorage.setItem("sonar-scroll", location.hash + "|" + Math.round(window.scrollY)); } catch (e) {}
    location.reload();
  }, 5000);
}
render();
schedule();
})();
</script>
