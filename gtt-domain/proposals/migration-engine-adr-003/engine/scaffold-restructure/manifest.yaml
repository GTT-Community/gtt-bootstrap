# GTT Canonical Scaffold - declarative definition.
#
# Canonical reference: https://github.com/GTT-Community/gtt-method/blob/main/GTT-CANONICAL-v2.1.md
#
# DATA ONLY. No logic lives here and none may be added: the behaviour of each
# component belongs to the Engine (gtt/scripts/), never to this file. It states
# what the scaffold IS, so that a future `gtt init` (not implemented here) and
# the human reader consume one definition instead of re-deriving the layout.
#
# It is a description of the repository, never a second source of truth: when
# it disagrees with the repository, that is a finding to surface (through
# gtt/scripts/gtt-validate.sh and the gtt-audit skill), not a value to trust.
# There is exactly ONE scaffold. ADEs contribute an overlay to it (see
# `overlays`); they never define one of their own.
#
# Entries are single-line flow mappings so the file stays greppable:
#   path       location relative to the project root (trailing / = directory)
#   required   true = the scaffold is incomplete without it
#   derived    true = regenerated by a script; never hand-edited
#   state      true = written by a governed act, not authored
#   role       what it is for (prose)

scaffold:
  id: gtt-canonical-scaffold
  version: 1                      # scaffold layout version - NOT the GTT version
  canon: GTT-CANONICAL-v2.1

layers:
  engine: gtt/                    # the GTT implementation; contains no project-governed state
  governance: project-root        # the project's governed state and its change flow
  documentation: docs/            # GTT's own documentation; never loaded by any agent
  overlay: ade-native-paths       # exactly one ADE integration per installed project

engine:
  - { path: gtt/scripts/, kind: dir, required: true, role: deterministic services and checks (Bash and Python) }
  - { path: gtt/index/, kind: dir, required: true, role: artifact identity manifest and derived technical index }
  - { path: gtt/index/artifacts.json, kind: file, required: true, role: identity manifest - authoritative for id to path only }
  - { path: gtt/index/technical-index.json, kind: file, required: true, derived: true, role: derived accelerator - never a source of truth }
  - { path: gtt/protection/, kind: dir, required: true, role: GTTGuard registry }
  - { path: gtt/protection/registry.yaml, kind: file, required: true, derived: true, role: regenerated from source markers - never hand-edited }
  - { path: gtt/session-adapters/, kind: dir, required: true, role: per-ADE Session Memory declarations (data only) }
  - { path: gtt/scaffold/manifest.yaml, kind: file, required: true, role: this file }
  - { path: gtt/README.md, kind: file, required: false, role: project-facing README of the Engine (installed into host projects; absent in the catalog repository) }

governance:
  - { path: context/, kind: dir, required: true, role: L0 governed context }
  - { path: context/stack.md, kind: file, required: true, role: the seven-view architecture map }
  - { path: context/architecture.md, kind: file, required: true, role: architecture in prose }
  - { path: context/constraints.md, kind: file, required: true, role: hard limits - the only context file always loaded }
  - { path: context/principles.md, kind: file, required: true, role: design principles in force }
  - { path: context/solution-vision.md, kind: file, required: true, role: purpose and non-goals }
  - { path: context/glossary.md, kind: file, required: true, role: project-specific terms }
  - { path: adr/, kind: dir, required: true, role: L1 accepted decisions }
  - { path: adr/ADR-TEMPLATE.md, kind: file, required: true, role: blank ADR }
  - { path: proposals/, kind: dir, required: true, role: the one directory an agent may write; drafts and promotion packages }
  - { path: backlog.md, kind: file, required: true, role: development line - Epics and Stories }
  - { path: change-request.md, kind: file, required: true, role: front door for change intent }
  - { path: session.md, kind: file, required: false, derived: true, role: operational-only Session Memory - never authority or evidence }
  - { path: .frozen, kind: file, required: false, state: true, role: freeze marker written by gtt-freeze.sh after human confirmation }
  - { path: SOURCE-BRIEF.*, kind: glob, required: false, role: original design source preserved by the bootstrap when one existed }

documentation:
  - { path: docs/, kind: dir, required: true, role: GTT documentation }
  - { path: docs/index.md, kind: file, required: true, role: map of every file }
  - { path: docs/installation.md, kind: file, required: true, role: installation procedures }
  - { path: docs/installation.es.md, kind: file, required: true, role: Spanish mirror }
  - { path: docs/usage.md, kind: file, required: true, role: the normal development loop }
  - { path: docs/usage.es.md, kind: file, required: true, role: Spanish mirror }
  - { path: docs/gtt-completion.md, kind: file, required: true, role: durable bootstrap completion record - append only }
  - { path: docs/evidence.md, kind: file, required: true, role: technical claims classified by verification level }
  - { path: docs/docs.md, kind: file, required: true, role: methodology and portability }
  - { path: docs/session-adapter-contract.md, kind: file, required: true, role: contract every Session Memory adapter must meet }

entry_points:
  - { path: AGENTS.md, kind: file, required: true, role: portable agent contract - also the discovery file some ADEs read }
  - { path: readme-gtt.md, kind: file, required: true, role: human entry point }
  - { path: readme-gtt.es.md, kind: file, required: true, role: Spanish mirror }

overlays:
  # An installed project receives exactly ONE, resolved from the ADE executing the
  # bootstrap. The catalog repository ships all of them, which is why none is required.
  - { id: claude, path: .claude/, kind: dir, required: false, role: Claude Code overlay }
  - { id: kiro, path: .kiro/, kind: dir, required: false, role: Kiro overlay }
  - { id: copilot, path: .copilot/copilot-instructions.md, kind: file, required: false, role: GitHub Copilot overlay }
  - { id: codex, path: AGENTS.md, kind: file, required: false, role: Codex takes no overlay beyond the entry point }

naming:
  # Lowercase applies to every name this scaffold defines. These follow an external
  # or established convention and are deliberately left as they are:
  exceptions:
    - AGENTS.md            # ADE discovery name; case-sensitive on some platforms
    - SOURCE-BRIEF.*       # preserved-source convention of the bootstrap procedure
    - ADR-*.md             # ADR identity (ADR-NNN)
    - PROPOSAL-*.md        # staged-draft naming under proposals/
    - CLAUDE.md            # ADE-defined
    - SKILL.md             # ADE-defined
